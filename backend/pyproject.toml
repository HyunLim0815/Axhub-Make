[project]
name = "axhub-make-backend"
version = "2.0.0"
description = "Axhub Make — FastAPI 后端服务"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.6",
    "uvicorn[standard]>=0.34.0",
    "gunicorn>=23.0.0",
    "tortoise-orm>=0.25.0",
    "asyncpg>=0.30.0",
    "aerich>=0.8.0",
    "pydantic-settings>=2.14.2",
    "redis[hiredis]>=5.2.1",
    "loguru>=0.7.3",
    "structlog>=0.7.3",
    "apscheduler>=3.11.3",
    "prometheus-fastapi-instrumentator>=7.1.0",
    "sentry-sdk[fastapi]>=2.66.1",
    "slowapi>=0.1.10",
    "httpx>=0.28.1",
    "orjson>=3.11.9",
    "secure>=2.0.1",
    "asgi-correlation-id>=5.0.1",
    "openai>=1.0.0",
    "langgraph>=0.5.0",
    "langchain-core>=0.3.0",
    "bleach>=6.2.0",
    "python-multipart>=0.0.19",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.9.0",
    "mypy>=1.15.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
